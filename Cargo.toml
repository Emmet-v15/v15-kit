[workspace]
resolver = "2"
members = ["crates/v15-update", "crates/v15-release", "crates/v15-shell"]

[workspace.package]
version = "0.6.2"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false
repository = "https://github.com/Emmet-v15/v15-kit"

# Apps pin the exact same tauri / tauri-build (docs/STANDARD.md): an app
# using a different tauri version fails to resolve instead of building two
# runtimes.
[workspace.dependencies]
v15-update = { path = "crates/v15-update" }
tauri = { version = "=2.12.1", default-features = false, features = ["wry", "webview-data-url"] }
tauri-plugin = { version = "=2.7.1", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2.2"
ureq = "2.12"
brotli = "8"
brotli-decompressor = "5"
windows-sys = "0.59"
